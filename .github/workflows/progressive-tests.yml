name: Progressive Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run progressive tests (Linux)
        working-directory: test
        run: |
          make clean
          make run

  windows:
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and run progressive tests (Windows)
        working-directory: test
        shell: powershell
        run: ./run-tests.ps1
